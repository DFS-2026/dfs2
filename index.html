<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFS Catalog - Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; padding: 15px; min-height: 100vh; }
    
    header { background: #151d30; border: 1px solid #2a364f; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .logo-circle { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #f59e0b; background: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .title { color: #f59e0b; font-weight: bold; font-size: 18px; letter-spacing: 1px; }
    .subtitle { color: #94a3b8; font-size: 11px; display: block; }
    
    .box { background: #151d30; border: 1px solid #2a364f; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    .box-title { color: #94a3b8; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
    .form-row { display: flex; flex-wrap: wrap; gap: 8px; }
    input[type="text"], select { background: #0b0f19; border: 1px solid #334155; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; flex: 1; min-width: 150px; outline: none; }
    input:focus, select:focus { border-color: #f59e0b; }
    .btn-gold { background: #f59e0b; color: #000; font-weight: bold; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-admin { background: #334155; color: #f59e0b; border: 1px solid #f59e0b; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    .nav-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; border-bottom: 1px solid #2a364f; }
    .tab { background: #151d30; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .tab.active { background: #f59e0b; color: #000; font-weight: bold; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .card { background: #151d30; border: 1px solid #2a364f; padding: 10px; border-radius: 12px; }
    .cover-box { width: 100%; height: 130px; background: #0b0f19; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; border: 1px solid #1e293b; cursor: pointer; }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-weight: bold; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; display: flex; justify-content: space-between; }
    
    .header-folder { display: flex; align-items: center; justify-content: space-between; background: #151d30; border: 1px solid #2a364f; padding: 12px; border-radius: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .btn-back { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-upload { background: #f59e0b; color: #000; font-weight: bold; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; display: inline-block; }
    
    .photo-actions { display: flex; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a364f; }
    .btn-del { background: rgba(239, 68, 68, 0.2); color: #f87171; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; flex: 1; }
    
    #modalZoom { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    #modalZoom img { max-width: 100%; max-height: 85vh; border-radius: 12px; border: 2px solid #f59e0b; object-fit: contain; }
    #modalZoom .cerrar-modal { position: absolute; top: 20px; right: 20px; background: #f59e0b; color: #000; font-weight: bold; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }

    .hidden { display: none !important; }
  </style>

  <!-- FIREBASE SDKs y LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAH7q1Kl5koBX6zYDCjasAWbE-I_JBK6w",
      authDomain: "dfs-gallery.firebaseapp.com",
      projectId: "dfs-gallery",
      storageBucket: "dfs-gallery.firebasestorage.app",
      messagingSenderId: "17442314618",
      appId: "1:17442314618:web:c0da4d9e9e2882ba761ec3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let categoriaActual = 'Todas';
    let carpetaObjActual = null;
    let esAdmin = false;

    onAuthStateChanged(auth, (user) => {
      esAdmin = !!user;
      const boxCrear = document.getElementById('boxCrearCarpeta');
      const btnAdminAcc = document.getElementById('btnAdminAcceso');
      
      if (esAdmin) {
        if(boxCrear) boxCrear.classList.remove('hidden');
        if(btnAdminAcc) btnAdminAcc.innerText = "🔓 Cerrar Sesión Creador";
      } else {
        if(boxCrear) boxCrear.classList.add('hidden');
        if(btnAdminAcc) btnAdminAcc.innerText = "🔒 Soy Creador";
      }
      cargarCatalogo();
      if(carpetaObjActual) refrescarCarpetaActual();
    });

    window.toggleAdminModal = function() {
      if (esAdmin) {
        signOut(auth).then(() => alert("Sesión cerrada. Ahora la web está en modo solo lectura."));
      } else {
        const email = prompt("Introduce tu email de creador:");
        const pass = prompt("Introduce tu contraseña:");
        if (email && pass) {
          signInWithEmailAndPassword(auth, email, pass)
            .then(() => alert("¡Bienvenido! Modo creador activado."))
            .catch((err) => alert("Error de acceso: " + err.message));
        }
      }
    };

    window.filtrar = function(cat) {
      categoriaActual = cat;
      document.querySelectorAll('.tab').forEach(b => {
        if (b.innerText.indexOf(cat) !== -1) b.classList.add('active');
        else b.classList.remove('active');
      });
      irInicio();
    };

    window.cargarCatalogo = async function() {
      document.getElementById('vistaCarpetas').classList.remove('hidden');
      document.getElementById('vistaFotos').classList.add('hidden');
      
      const grid = document.getElementById('gridCarpetas');
      grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Cargando catálogo en tiempo real...</p>';
      
      try {
        const querySnapshot = await getDocs(collection(db, "carpetas"));
        grid.innerHTML = '';
        let lista = [];

        querySnapshot.forEach((docSnap) => {
          let c = docSnap.data();
          c.firebaseId = docSnap.id;
          if (categoriaActual === 'Todas' || c.categoria === categoriaActual) {
            lista.push(c);
          }
        });

        document.getElementById('txtTituloCat').innerText = 'Carpetas (' + categoriaActual + ') - Total: ' + lista.length;

        if (lista.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1/-1; color: #64748b; font-size: 13px; text-align: center; padding: 20px;">No hay carpetas creadas todavía.</p>';
          return;
        }

        lista.forEach(c => {
          const div = document.createElement('div');
          div.className = 'card';
          div.onclick = () => abrirCarpeta(c);

          const tieneFotos = c.fotos && c.fotos.length > 0;
          div.innerHTML = `
            <div class="cover-box">
              ${tieneFotos ? `<img src="${c.fotos[0].url}" alt="${c.nombre}">` : '<span style="font-size: 30px;">📁</span>'}
            </div>
            <div class="card-title">${c.nombre}</div>
            <div class="card-sub">
              <span>${c.categoria}</span>
              <span>${c.fotos ? c.fotos.length : 0} fotos</span>
            </div>
            ${esAdmin ? `<button class="btn-del" style="margin-top:8px; width:100%;" onclick="event.stopPropagation(); borrarCarpeta('${c.firebaseId}')">🗑️
