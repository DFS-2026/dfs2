<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFS Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .gold-accent { color: #f59e0b; }
    .bg-gold { background-color: #f59e0b; }
    .border-gold { border-color: #f59e0b; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ENCABEZADO Y LOGO -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div onclick="irInicio()" class="flex items-center space-x-3 cursor-pointer">
        <div class="w-12 h-12 rounded-full border-2 border-gold flex items-center justify-center bg-black overflow-hidden shadow-md">
          <!-- Logo DFS con Corona y Balón -->
          <svg class="w-8 h-8 text-amber-500" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wider gold-accent leading-none">DFS CATALOG</h1>
          <span class="text-xs text-slate-400">Galería Oficial & Colecciones</span>
        </div>
      </div>
      <button onclick="irInicio()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
        🏠 Inicio
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full p-4 flex-grow space-y-6">

    <!-- PANEL PERMANENTE: CREAR CARPETA / EQUIPO -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
      <h2 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">📁 Crear Nueva Carpeta / Equipo</h2>
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="inputNombreCarpeta" type="text" placeholder="Ej: Real Madrid, Barcelona, Sevilla..." 
               class="bg-slate-950 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 flex-grow focus:outline-none focus:border-amber-500">
        
        <select id="selectCategoriaCarpeta" class="bg-slate-950 border border-slate-700 text-slate-300 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-500">
          <option value="La Liga">La Liga</option>
          <option value="Niños">Niños</option>
          <option value="Retro">Retro</option>
          <option value="Selecciones">Selecciones</option>
          <option value="Ligas Europeas">Ligas Europeas</option>
          <option value="Otras Ligas">Otras Ligas</option>
        </select>

        <button onclick="crearCarpeta()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center justify-center space-x-1 shadow-md">
          <span>+ Crear Carpeta</span>
        </button>
      </div>
    </section>

    <!-- BARRA DE PESTAÑAS (CATEGORÍAS) -->
    <nav class="flex space-x-2 overflow-x-auto pb-2 border-b border-slate-800 text-sm scrollbar-none" id="barrapestanas">
      <button onclick="filtrarCategoria('Todas')" class="pestana-btn active font-medium px-4 py-2 rounded-xl bg-amber-500 text-slate-950 transition whitespace-nowrap" data-cat="Todas">📷 Todas</button>
      <button onclick="filtrarCategoria('La Liga')" class="pestana-btn font-medium px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 transition whitespace-nowrap" data-cat="La Liga">⚽ La Liga</button>
      <button onclick="filtrarCategoria('Niños')" class="pestana-btn font-medium px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 transition whitespace-nowrap" data-cat="Niños">🧒 Niños</button>
      <button onclick="filtrarCategoria('Retro')" class="pestana-btn font-medium px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 transition whitespace-nowrap" data-cat="Retro">⏳ Retro</button>
      <button onclick="filtrarCategoria('Selecciones')" class="pestana-btn font-medium px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 transition whitespace-nowrap" data-cat="Selecciones">🌍 Selecciones</button>
      <button onclick="filtrarCategoria('Ligas Europeas')" class="pestana-btn font-medium px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 transition whitespace-nowrap" data-cat="Ligas Europeas">🏆 Ligas Europeas</button>
      <button onclick="filtrarCategoria('Otras Ligas')" class="pestana-btn font-medium px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 transition whitespace-nowrap" data-cat="Otras Ligas">🌐 Otras Ligas</button>
    </nav>

    <!-- VISTA 1: GRID DE CARPETAS / EQUIPOS -->
    <section id="vistaCarpetas" class="space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="tituloCategoria" class="text-lg font-bold text-slate-200">Carpetas (Todas)</h3>
        <span id="contadorCarpetas" class="text-xs text-slate-400">0 carpetas</span>
      </div>
      <div id="gridCarpetas" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <!-- Se genera dinámicamente -->
      </div>
    </section>

    <!-- VISTA 2: DENTRO DE UNA CARPETA (FOTOS) -->
    <section id="vistaFotos" class="hidden space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <div class="flex items-center space-x-3">
          <button onclick="volverACarpetas()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-xl transition">
            ← Volver
          </button>
          <div>
            <h2 id="tituloCarpetaAbierta" class="text-xl font-bold text-amber-500">Nombre Carpeta</h2>
            <p id="subtituloCarpetaAbierta" class="text-xs text-slate-400">Categoría</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <label class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition cursor-pointer flex items-center space-x-1">
            <span>+ Subir Foto</span>
            <input type="file" id="inputFoto" accept="image/*" class="hidden" onchange="subirFoto(event)">
          </label>
          <button onclick="borrarCarpetaActual()" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-3 py-2 rounded-xl text-xs transition">
            🗑️ Eliminar Carpeta
          </button>
        </div>
      </div>

      <!-- GRID DE FOTOS SUBIDAS -->
      <div id="gridFotos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <!-- Las imágenes se renderizan dinámicamente -->
      </div>
    </section>

  </main>

  <script>
    // ESTADO LOCAL DE LA APLICACIÓN
    let db = JSON.parse(localStorage.getItem('dfs_catalog_db')) || {
      carpetas: [
        { id: 'c1', nombre: 'Real Madrid', categoria: 'La Liga', fotos: [] },
        { id: 'c2', nombre: 'FC Barcelona', categoria: 'La Liga', fotos: [] }
      ]
    };

    let categoriaActual = 'Todas';
    let carpetaAbiertaId = null;

    // GUARDAR EN LOCALSTORAGE CON COMPRESIÓN DE FOTOS
    function guardarDB() {
      try {
        localStorage.setItem('dfs_catalog_db', JSON.stringify(db));
      } catch (e) {
        alert("Atención: El almacenamiento local está lleno. Intenta subir fotos de menor tamaño.");
      }
    }

    // CREAR CARPETA NUEVA
    function crearCarpeta() {
      const input = document.getElementById('inputNombreCarpeta');
      const select = document.getElementById('selectCategoriaCarpeta');
      const nombre = input.value.trim();
      const categoria = select.value;

      if (!nombre) {
        alert("Por favor, escribe un nombre para la carpeta.");
        return;
      }

      const nuevaCarpeta = {
        id: 'c_' + Date.now(),
        nombre: nombre,
        categoria: categoria,
        fotos: []
      };

      db.carpetas.push(nuevaCarpeta);
      guardarDB();
      input.value = '';
      renderizarCarpetas();
    }

    // FILTRAR CATEGORÍAS
    function filtrarCategoria(cat) {
      categoriaActual = cat;
      document.querySelectorAll('.pestana-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "pestana-btn active font-medium px-4 py-2 rounded-xl bg-amber-500 text-slate-950 transition whitespace-nowrap";
        } else {
          btn.className = "pestana-btn font-medium px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 transition whitespace-nowrap";
        }
      });

      // Si estamos en la vista de fotos, volvemos a la vista de carpetas
      volverACarpetas();
    }

    // RENDERIZAR VISTA DE CARPETAS
    function renderizarCarpetas() {
      const grid = document.getElementById('gridCarpetas');
      const titulo = document.getElementById('tituloCategoria');
      const contador = document.getElementById('contadorCarpetas');
      grid.innerHTML = '';

      let filtradas = db.carpetas;
      if (categoriaActual !== 'Todas') {
        filtradas = db.carpetas.filter(c => c
