<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFS Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .gold-accent { color: #f59e0b; }
    .bg-gold { background-color: #f59e0b; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4">

  <!-- CABECERA CON LOGO DFS -->
  <header class="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6 shadow-lg flex items-center justify-between">
    <div onclick="irInicio()" class="flex items-center space-x-3 cursor-pointer">
      <div class="w-10 h-10 rounded-full border-2 border-amber-500 bg-black flex items-center justify-center">
        👑
      </div>
      <div>
        <h1 class="text-lg font-bold text-amber-500 leading-none">DFS CATALOG</h1>
        <span class="text-xs text-slate-400">Galería Oficial</span>
      </div>
    </div>
    <button onclick="resetearYLimpiar()" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500/30 border border-red-500/30 px-3 py-1.5 rounded-xl">
      🔄 Reiniciar App
    </button>
  </header>

  <main class="max-w-4xl mx-auto w-full space-y-6 flex-grow">

    <!-- FORMULARIO DIRECTO PARA CREAR CARPETAS -->
    <section class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">➕ Crear Nueva Carpeta / Equipo</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="nombreInput" type="text" placeholder="Ej: Real Madrid, Barcelona, Sevilla..." class="bg-slate-950 border border-slate-700 text-white text-sm rounded-xl px-4 py-2 flex-grow focus:outline-none focus:border-amber-500">
        
        <select id="categoriaSelect" class="bg-slate-950 border border-slate-700 text-slate-300 text-sm rounded-xl px-3 py-2">
          <option value="La Liga">La Liga</option>
          <option value="Niños">Niños</option>
          <option value="Retro">Retro</option>
          <option value="Selecciones">Selecciones</option>
          <option value="Ligas Europeas">Ligas Europeas</option>
          <option value="Otras Ligas">Otras Ligas</option>
        </select>

        <button onclick="crearCarpetaBoton()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm">
          Guardar Carpeta
        </button>
      </div>
    </section>

    <!-- PESTAÑAS -->
    <nav class="flex space-x-2 overflow-x-auto pb-2 border-b border-slate-800 text-sm">
      <button onclick="cambiarPestana('Todas')" class="btn-pestana bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl whitespace-nowrap" data-cat="Todas">📷 Todas</button>
      <button onclick="cambiarPestana('La Liga')" class="btn-pestana bg-slate-900 text-slate-300 px-4 py-2 rounded-xl whitespace-nowrap" data-cat="La Liga">⚽ La Liga</button>
      <button onclick="cambiarPestana('Niños')" class="btn-pestana bg-slate-900 text-slate-300 px-4 py-2 rounded-xl whitespace-nowrap" data-cat="Niños">🧒 Niños</button>
      <button onclick="cambiarPestana('Retro')" class="btn-pestana bg-slate-900 text-slate-300 px-4 py-2 rounded-xl whitespace-nowrap" data-cat="Retro">⏳ Retro</button>
      <button onclick="cambiarPestana('Selecciones')" class="btn-pestana bg-slate-900 text-slate-300 px-4 py-2 rounded-xl whitespace-nowrap" data-cat="Selecciones">🌍 Selecciones</button>
      <button onclick="cambiarPestana('Ligas Europeas')" class="btn-pestana bg-slate-900 text-slate-300 px-4 py-2 rounded-xl whitespace-nowrap" data-cat="Ligas Europeas">🏆 Ligas Europeas</button>
    </nav>

    <!-- VISTA CARPETAS -->
    <section id="seccionCarpetas" class="space-y-4">
      <h3 id="tituloVista" class="text-base font-bold text-slate-200">Carpetas disponibles</h3>
      <div id="contenedorCarpetas" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </section>

    <!-- VISTA FOTOS (DENTRO DE UNA CARPETA) -->
    <section id="seccionFotos" class="hidden space-y-4">
      <div class="flex items-center justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <button onclick="irInicio()" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-xl text-xs">← Volver a Carpetas</button>
        <h3 id="nombreCarpetaActiva" class="font-bold text-amber-500"></h3>
        <label class="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs cursor-pointer">
          + Subir Foto
          <input type="file" accept="image/*" class="hidden" onchange="subirImagen(event)">
        </label>
      </div>

      <div id="contenedorFotos" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </section>

  </main>

  <script>
    let datos = JSON.parse(localStorage.getItem('dfs_db_v2')) || [
      { id: '1', nombre: 'Real Madrid', categoria: 'La Liga', fotos: [] },
      { id: '2', nombre: 'FC Barcelona', categoria: 'La Liga', fotos: [] }
    ];
    let catActiva = 'Todas';
    let carpetaActivaId = null;

    function guardar() {
      localStorage.setItem('dfs_db_v2', JSON.stringify(datos));
    }

    function resetearYLimpiar() {
      localStorage.removeItem('dfs_db_v2');
      location.reload();
    }

    function crearCarpetaBoton() {
      const nombreInput = document.getElementById('nombreInput');
      const catSelect = document.getElementById('categoriaSelect');
      const val = nombreInput.value.trim();

      if (!val) {
        alert("Escribe un nombre para la carpeta");
        return;
      }

      datos.push({
        id: Date.now().toString(),
        nombre: val,
        categoria: catSelect.value,
        fotos: []
      });

      guardar();
      nombreInput.value = '';
      mostrarCarpetas();
    }

    function cambiarPestana(cat) {
      catActiva = cat;
      document.querySelectorAll('.btn-pestana').forEach(b => {
        if (b.dataset.cat === cat) {
          b.className = "btn-pestana bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl whitespace-nowrap";
        } else {
          b.className = "btn-pestana bg-slate-900 text-slate-300 px-4 py-2 rounded-xl whitespace-nowrap";
        }
      });
      irInicio();
    }

    function mostrarCarpetas() {
      document.getElementById('seccionCarpetas').classList.remove('hidden');
      document.getElementById('seccionFotos').classList.add('hidden');

      const cont = document.getElementById('contenedorCarpetas');
      cont.innerHTML = '';

      let lista = catActiva === 'Todas' ? datos : datos.filter(d => d.categoria === catActiva);

      document.getElementById('tituloVista').textContent = `Carpetas (${catActiva}) - Total: ${lista.length}`;

      lista.forEach(c => {
        const div = document.createElement('div');
        div.className = "bg-slate-900 border border-slate-800 hover:border-amber-500 p-4 rounded-2xl cursor-pointer";
        div.onclick = () => abrirCarpeta(c.id);
        div.innerHTML = `
          <div class="h-24 bg-slate-950 rounded-xl mb-2 flex items-center justify-center text-2xl">📁</div>
          <h4 class="font-bold text-white text-sm truncate">${c.nombre}</h4>
          <p class="text-xs text-slate-400 mt-1">${c.categoria} • ${c.fotos.length} fotos</p>
        `;
        cont.appendChild(div);
      });
    }

    function abrirCarpeta(id) {
      carpetaActivaId = id;
      const c = datos.find(item => item.id === id);
      if (!c) return;

      document.getElementById('nombreCarpetaActiva').textContent = c.nombre;
      document.getElementById('seccionCarpetas').classList.add('hidden');
      document.getElementById('seccionFotos').classList.remove('hidden');
      mostrarFotos();
    }

    function irInicio() {
      carpetaActivaId = null;
      mostrarCarpetas();
    }

    function subirImagen(e) {
      const file = e.target.files[0];
      if (!file || !carpetaActivaId) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const c = datos.find(item => item.id === carpetaActivaId);
        if (c) {
          c.fotos.push({
            id: Date.now().toString(),
            nombre: file.name.replace(/\.[^/.]+$/, ""),
            url: evt.target.result
          });
          guardar();
          mostrarFotos();
        }
      };
      reader.readAsDataURL(file);
    }

    function mostrarFotos() {
      const cont = document.getElementById('contenedorFotos');
      cont.innerHTML = '';
      const c = datos.find(item => item.id === carpetaActivaId);
      if (!c) return;

      c.fotos.forEach(f => {
        const div = document.createElement('div');
        div.className = "bg-slate-900 border border-slate-800 p-2 rounded-2xl flex flex-col justify-between";
        div.innerHTML = `
          <img src="${f.url}" class="h-32 w-full object-cover rounded-xl mb-2">
          <p class="text-xs font-semibold text-slate-200 truncate mb-2">${f.nombre}</p>
          <div class="flex gap-1 border-t border-slate-800 pt-2">
            <button onclick="renombrarFoto('${f.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded-lg">✏️ Editar</button>
            <button onclick="eliminarFoto('${f.id}')" class="bg-red-500/20 text-red-400 text-xs px-2 rounded-lg">🗑️</button>
          </div>
        `;
        cont.appendChild(div);
      });
    }

    function renombrarFoto(fotoId) {
      const c = datos.find(item => item.id === carpetaActivaId);
      if (!c) return;
      const f = c.fotos.find(foto => foto.id === fotoId);
      if (!f) return;

      const nuevo = prompt("Nuevo nombre para la foto:", f.nombre);
      if (nuevo && nuevo.trim() !== "") {
        f.nombre = nuevo.trim();
        guardar();
        mostrarFotos();
      }
    }

    function eliminarFoto(fotoId) {
      const c = datos.find(item => item.id === carpetaActivaId);
      if (!c) return;
      c.fotos = c.fotos.filter(foto => foto.id !== fotoId);
      guardar();
      mostrarFotos();
    }

    // Cargar al inicio
    mostrarCarpetas();
  </script>
</body>
</html>
